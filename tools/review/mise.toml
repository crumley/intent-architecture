# The review tool's toolchain + tasks (mise). Its own gate, beside the repository
# root's Markdown gate (which also formats and link-checks this tree's Markdown).
#
#   mise install         # provision bun + node (the JS dev tools come via `deps`)
#   mise run fmt         # format + fix code in place (Biome)
#   mise run check       # the full no-writes gate — exactly what CI runs
#   mise run build       # rebuild the bundle into the skill (commit it with the change)
#
# Node is pinned at the oldest major the bundle supports (20), so the end-to-end
# test proves the shipped file where its floor is. Bun builds and tests; see
# design/decisions/0001-typescript-bun-toolchain.md.

[tools]
bun = "1.4.0"
node = "20.20.2"

[tasks.deps]
description = "Install JS dev tools exactly as locked (bun.lock)"
run = "bun install --frozen-lockfile"

[tasks.fmt]
description = "Format + fix code in place (Biome)"
depends = ["deps"]
run = "bun x biome check --write ."

[tasks.lint]
description = "Code format + lint, no writes (Biome)"
depends = ["deps"]
run = "bun x biome ci ."

[tasks.typecheck]
description = "TypeScript strict type check (tsc --noEmit)"
depends = ["deps"]
run = "bun x tsc --noEmit"

[tasks.build]
description = "Build the single-file bundle into the skill's scripts/review.mjs"
depends = ["deps"]
run = "bun scripts/build.ts"

[tasks.bundle-check]
description = "Fail if the committed bundle differs from a fresh build (no writes)"
depends = ["deps"]
run = "bun scripts/build.ts --check"

[tasks.test]
description = "Run the test suite (bun test; the e2e test runs the bundle under node)"
depends = ["deps"]
run = "bun test"

[tasks.check]
description = "The full gate, no writes: lint + typecheck + test + bundle drift (CI runs exactly this)"
depends = ["lint", "typecheck", "test", "bundle-check"]
