# CI runs the same gate a developer runs locally: `mise run check`.
#
# mise-action installs mise, reads mise.toml, and provisions the exact pinned
# toolchain (dprint, lychee) that `mise install` provisions on a laptop. The
# single source of truth for "is this green?" is one command, byte-for-byte
# identical locally and here. See mise.toml / CONTRIBUTING.md.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - run: mise run check
